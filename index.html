<style>
:root{color-scheme:dark;--ink:#f5f2e9;--muted:#a8b4ae;--accent:#c2f479;--line:#344239}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#101611 radial-gradient(ellipse at 80% 0,#233223,transparent 64%);font:16px/1.7 system-ui,sans-serif;min-height:100svh}
.shell{width:min(1050px,calc(100% - 36px));margin:auto}
header,footer,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header{padding:24px 0;border-bottom:1px solid var(--line)}
footer{padding:20px 0;border-top:1px solid var(--line);color:var(--muted)}
button,a{font:inherit}
button,.github{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:7px 14px;background:#1a241b;color:var(--ink);text-decoration:none}
button:hover,.github:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.hero{position:relative;display:grid;grid-template-columns:1fr minmax(190px,300px);gap:clamp(24px,7vw,85px);align-items:center;min-height:65vh;padding:64px 0}
.tag{color:var(--accent);font:13px/1.5 ui-monospace,monospace;letter-spacing:.08em}
h1{font-size:clamp(2.75rem,8vw,6rem);line-height:1.15;margin:.17em 0 .25em}
.bio{color:var(--muted);max-width:47ch;font-size:clamp(1rem,2vw,1.3rem);margin:0 0 25px;text-align:start}
html[dir=rtl] .bio{text-align:right}.github{margin-inline-end:8px;margin-block-end:8px;display:inline-block;background:var(--accent);color:#152110;font-weight:700}
figure{margin:0;padding:12px;border:1px solid var(--line);border-radius:20px;background:#1b251e}
figure img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:50%}
figcaption{margin-top:10px;color:var(--muted);font:12px ui-monospace,monospace;text-align:center}
.cursor{position:absolute;z-index:2;pointer-events:none;color:#172211;font:bold 11px ui-monospace,monospace;opacity:0;inset:0 auto auto 0}
.cursor span{background:var(--accent);border-radius:4px;padding:4px 7px;white-space:nowrap}
.cursor svg{display:block;width:20px;fill:var(--accent);stroke:#142014}
[hidden]{display:none!important}
@media(max-width:650px){.hero{grid-template-columns:1fr;padding:40px 0;min-height:auto}figure{grid-row:1;width:min(55vw,225px)}}
</style>

  document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
  byId('name').textContent = byId('footer-name').textContent = copy.name;
  byId('label').textContent = copy.label;
  language.textContent = copy.toggle;
  language.lang = locale === 'ar' ? 'en' : 'ar';
  replay.textContent = copy.replay;
  byId('workshop-link').textContent = locale === 'ar' ? 'جرّب Cursor Workshop ↗' : 'Try Cursor Workshop ↗';
  skip.textContent = copy.skip;
  byId('portrait').querySelector('img').alt = copy.alt;
}
function build() {
  finish();
  if (motion.matches || !Element.prototype.animate) return;
  skip.hidden = false;
  const hero = byId('hero').getBoundingClientRect();
  const cursors = document.querySelectorAll('.cursor');
  const tasks = [['name',0,470],['portrait',1,680]];
  for (const [id,index,delay] of tasks) {
    const element = byId(id);
    const bounds = element.getBoundingClientRect();
    const x = bounds.left - hero.left;
    const y = bounds.top - hero.top;
    const endX = Math.min(hero.width - 66, x + bounds.width * .76);
    const startX = locale === 'ar' && index === 0 ? endX : x;
    const finalX = locale === 'ar' && index === 0 ? x : endX;
    const mask = locale === 'ar' && index === 0 ? 'inset(0 0 0 100%)' : 'inset(0 100% 0 0)';
    animations.push(element.animate([{opacity:0,clipPath:mask},{opacity:1,clipPath:'inset(0)'}],
      {duration:650,delay,easing:'ease-out',fill:'backwards'}));
    animations.push(cursors[index].animate([
      {opacity:0,transform:'translate(20px, 15px)'},
      {opacity:1,transform:'translate('+startX+'px,'+y+'px)',offset:.37},
      {opacity:1,transform:'translate('+finalX+'px,'+(y+Math.min(bounds.height*.6,65))+'px)',offset:.86},
      {opacity:0,transform:'translate('+finalX+'px,'+(y+70)+'px)'}
    ], {duration:delay+800,easing:'ease-in-out'}));
  }
  animations.push(byId('bio').animate([{opacity:0},{opacity:1}],{duration:350,delay:1160,fill:'backwards'}));
  animations[animations.length-1].onfinish = finish;
}
language.hidden = false;
replay.hidden = motion.matches || !Element.prototype.animate;
language.onclick = () => { finish(); translate(locale === 'ar' ? 'en' : 'ar'); };
skip.onclick = finish;
replay.onclick = build;
motion.addEventListener('change', () => { finish(); replay.hidden = motion.matches || !Element.prototype.animate; });
byId('hero').addEventListener('focusin', finish);
build();
</script>
</body>
